server:
  port: 8080

spring:
  devtools:
    restart:
      enabled: true

  config:
    import:
      - database.properties
      - api.properties
      - jwt.properties
      - s3.properties

  datasource:
    url: ${DB.URL}
    username: ${DB.USERNAME}
    password: ${DB.PASSWORD}
    driver-class-name: ${DB.DRIVER}
  jpa:
    hibernate:
      ddl-auto: ${HIBERNATE_DDL_AUTO:none}
    database-platform: ${DB.DIALECT}
    properties:
      hibernate:
        show_sql: true
        format_sql: true
        physical_naming_strategy: ${DB.NAMING_STRATEGY}
  cloud:
    aws:
      credentials:
        access-key: ${S3.ACCESS_KEY}
        secret-key: ${S3.SECRET_KEY}
      region:
        static: ${S3.REGION}
      s3:
        bucket: ${S3.BUCKET}
      stack:
        auto: false

logging:
  level:
    com.ssafy.solvedpick: ${LOG_LEVEL:DEBUG}
