name: solve-nyang-deploy-dev.yml
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create properties and yml
        run: |
          echo '${{ secrets.DATABASE_DEV_PROPERTIES }}' > ./src/main/resources/database.properties
          echo '${{ secrets.JWT_PROPERTIES }}' > ./src/main/resources/jwt.properties
          echo '${{ secrets.EXTERNAL_DEV_PROPERTIES }}' > ./src/main/resources/external.properties
          echo '${{ secrets.S3_PROPERTIES }}' > ./src/main/resources/s3.properties
          echo '${{ secrets.REDIS_DEV_PROPERTIES }}' > ./src/main/resources/redis.properties
          echo '${{ secrets.APPLICATION_DEV_PROPERTIES }}' > ./src/main/resources/application-dev.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'liberica'

      - name: Gradle caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Build Docker image
        run: docker build -t solve-nyang:latest .

      - name: Save Docker image as tar
        run: |
          docker save solve-nyang:latest -o solve-nyang.tar
          chmod 644 solve-nyang.tar
      - name: Send image + script to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
          source: "solve-nyang.tar,deploy.sh"
          target: "/home/ubuntu/solve-nyang"
          tar_tmp_path: ""
          tar_exec: ""

      - name: Execute deploy.sh on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
          script: |
            chmod +x /home/ubuntu/solve-nyang/deploy.sh
            /home/ubuntu/solve-nyang/deploy.sh
