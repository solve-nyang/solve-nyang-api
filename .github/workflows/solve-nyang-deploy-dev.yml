
name: solve-nyang-deploy-dev.yml
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create database-dev.properties
        run: |
          echo '${{ secrets.DATABASE_DEV_PROPERTIES }}' > ./src/main/resources/database.properties

      - name: Create jwt.properties
        run: |
          echo '${{ secrets.JWT_PROPERTIES }}' > ./src/main/resources/jwt.properties

      - name: Create external.properties
        run: |
          echo '${{ secrets.EXTERNAL_DEV_PROPERTIES }}' > ./src/main/resources/external.properties

      - name: Create s3.properties
        run: |
          echo '${{ secrets.S3_PROPERTIES }}' > ./src/main/resources/s3.properties

      - name: Create redis.properties
        run: |
          echo '${{ secrets.REDIS_DEV_PROPERTIES }}' > ./src/main/resources/redis.properties

      - name: Create application-dev.yml
        run: |
          echo '${{ secrets.APPLICATION_DEV_PROPERTIES }}' > ./src/main/resources/application-dev.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'liberica'

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant permission to gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/solve-nyang:latest .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/solve-nyang:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
          script: |
            cd /home/ubuntu/solve-nyang
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Stopping old container..."
            docker stop solve-nyang || true
            docker rm solve-nyang || true
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Pulling new image..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/solve-nyang:latest
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Running container..."
            docker run -d \
              --name solve-nyang \
              -p 8080:8080 \
              --add-host host.docker.internal:host-gateway \
              -v /home/ubuntu/solve-nyang/logs:/logs \
              --restart unless-stopped \
              ${{ secrets.DOCKERHUB_USERNAME }}/solve-nyang:latest
            echo "[$(date '+%Y-%m-%d %H:%M:%S')] Deployment completed!"