
name: solve-nyang-deploy-dev.yml
on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Create database-dev.properties
        run: |
          echo '${{ secrets.DATABASE_DEV_PROPERTIES }}' > ./src/main/resources/database.properties

      - name: Create jwt.properties
        run: |
          echo '${{ secrets.JWT_PROPERTIES }}' > ./src/main/resources/jwt.properties

      - name: Create api.properties
        run: |
          echo '${{ secrets.API_PROPERTIES }}' > ./src/main/resources/api.properties

      - name: Create s3.properties
        run: |
          echo '${{ secrets.S3_PROPERTIES }}' > ./src/main/resources/s3.properties

      - name: Create redis.properties
        run: |
          echo '${{ secrets.REDIS_PROPERTIES }}' > ./src/main/resources/redis.properties

      - name: Create application-dev.yml
        run: |
          echo '${{ secrets.APPLICATION_DEV_PROPERTIES }}' > ./src/main/resources/application-dev.yml

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'liberica'

      - name: Gradle Caching
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew clean build -x test

      - name: Deploy to EC2
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
          source: "build/libs/*.jar"
          target: "/home/ubuntu/solve-nyang"
          strip_components: 2

      - name: Execute deploy script
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEV_EC2_HOST }}
          username: ${{ secrets.DEV_EC2_USERNAME }}
          key: ${{ secrets.DEV_EC2_PRIVATE_KEY }}
          script: |
            export SPRING_ENV=dev
            cd solve-nyang/
            ./deploy.sh
